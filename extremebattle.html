<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Extreme Battlegrounds</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            padding: 0px;
            margin: 0px;
            overflow: hidden;
            background: #000;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: rgba(0,0,0,0);
        }
        .fullscreen {
            background: #000000;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0px;
            left: 0px;
        }
        #loading-cover {
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #unity-loading-bar {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #unity-progress-bar-empty {
            width: 30%;
            height: 12px;
            margin: 10px 20px 20px 10px;
            text-align: left;
            background: #202020;
        }
        #unity-progress-bar-full {
            width: 0%;
            height: 100%;
            background: #007EBD;
        }
    </style>

    <!-- YSDK Hatalarını ve Liderlik Tablosu Sorununu Çözen Mock Objesi -->
    <script>
        if (typeof YaGames === 'undefined') {
            window.YaGames = {
                init: function() {
                    return new Promise((resolve) => {
                        console.log("SDK Mock: Liderlik Tablosu ve Masaüstü Modu Aktif");
                        
                        // Masaüstü modunu zorla
                        const isMobile = false; 

                        resolve({
                            deviceInfo: {
                                type: 'desktop',
                                isMobile: function() { return false; },
                                isDesktop: function() { return true; },
                                isTablet: function() { return false; },
                                isTV: function() { return false; }
                            },
                            environment: {
                                app: { id: '12345' },
                                browser: { lang: 'tr' },
                                i18n: { lang: 'tr', tld: 'com' }
                            },
                            features: { 
                                LoadingAPI: { ready: () => console.log("Loading API Ready") }, 
                                GameplayAPI: { start: () => {}, stop: () => {} } 
                            },
                            adv: { 
                                showFullscreenAdv: (c) => { if(c.callbacks?.onClose) c.callbacks.onClose(); }, 
                                showRewardedVideo: (c) => { if(c.callbacks?.onClose) c.callbacks.onClose(); } 
                            },
                            getPlayer: () => Promise.resolve({ 
                                getName: () => "Player",
                                getUniqueID: () => "123",
                                getPhoto: () => "",
                                isAuthorized: function() { return true; },
                                getMode: () => "lite",
                                setData: () => Promise.resolve(),
                                getData: () => Promise.resolve({}),
                                setStats: () => Promise.resolve(),
                                getStats: () => Promise.resolve({})
                            }),
                            // Hata alınan 'setScore' sorununu çözen Leaderboards Mock yapısı
                            getLeaderboards: () => Promise.resolve({
                                getLeaderboardDescription: () => Promise.resolve({ title: "Leaderboard" }),
                                getLeaderboardPlayerEntry: () => Promise.resolve({ score: 0 }),
                                getLeaderboardEntries: () => Promise.resolve({ entries: [] }),
                                setScore: () => Promise.resolve() // Kritik: setScore fonksiyonu
                            }),
                            getStorage: () => Promise.resolve({
                                getItem: () => null,
                                setItem: () => Promise.resolve()
                            })
                        });
                    });
                }
            };
        }
    </script>
</head>
<body>
    <canvas id="canvas" class="fullscreen"></canvas>
    <div id="loading-cover" class="fullscreen">
        <div id="unity-loading-bar">
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
    </div>

    <script>
        const config = {
            dataUrl: "https://cdn.jsdelivr.net/gh/emrsdahclassroom/z77z77@main/Build/Build.data.unityweb",
            frameworkUrl: "https://cdn.jsdelivr.net/gh/emrsdahclassroom/z77z77@main/Build/Build.framework.js.unityweb",
            codeUrl: "https://cdn.jsdelivr.net/gh/emrsdahclassroom/z77z77@main/Build/Build.wasm.unityweb",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "Neptune Games",
            productName: "Extreme Battlegrounds",
            productVersion: "0.0.0.4"
        };

        let canvas = document.getElementById('canvas');
        let loadingCover = document.getElementById('loading-cover');
        let progressBarFull = document.getElementById('unity-progress-bar-full');

        document.addEventListener('contextmenu', event => event.preventDefault());

        function FocusGame() {
            window.focus();
            canvas.focus();
        }

        window.addEventListener('pointerdown', FocusGame);
        window.addEventListener('touchstart', FocusGame);

        let v_ysdk;
        let v_player;
        let v_game_instance;
        let v_sdk_init = false;

        function GameReadyNow(){ if(v_ysdk) v_ysdk.features.LoadingAPI?.ready(); }
        function GameplayStart(){ if(v_ysdk) v_ysdk.features.GameplayAPI?.start(); }
        function GameplayStop(){ if(v_ysdk) v_ysdk.features.GameplayAPI?.stop(); }

        function FullAdShow() {
            if(!v_ysdk) return;
            v_ysdk.adv.showFullscreenAdv({
                callbacks: {
                    onOpen: () => v_game_instance?.SendMessage('YAds', 'FullscreenAdOpen'),
                    onClose: () => v_game_instance?.SendMessage('YAds', 'FullscreenAdClosed'),
                    onError: () => v_game_instance?.SendMessage('YAds', 'FullscreenAdError')
                }
            });
        }

        function RewardAdShow() {
            if(!v_ysdk) return;
            v_ysdk.adv.showRewardedVideo({
                callbacks: {
                    onOpen: () => v_game_instance?.SendMessage('YAds', 'RewardAdOpen'),
                    onClose: () => v_game_instance?.SendMessage('YAds', 'RewardAdClosed'),
                    onRewarded: () => v_game_instance?.SendMessage('YAds', 'RewardAdRewarded'),
                    onError: () => v_game_instance?.SendMessage('YAds', 'RewardAdError')
                }
            });
        }

        YaGames.init().then(ysdk => {
            v_ysdk = ysdk;
            v_ysdk.getPlayer().then(_player => {
                v_player = _player;
                v_sdk_init = true;

                let unityLoader = document.createElement("script");
                unityLoader.src = "https://cdn.jsdelivr.net/gh/emrsdahclassroom/z77z77@main/Build/Build.loader.js";
                unityLoader.onload = () => {
                    createUnityInstance(canvas, config, (progress) => {
                        progressBarFull.style.width = `${progress * 100}%`;
                    }).then((unityInstance) => {
                        v_game_instance = unityInstance;
                        loadingCover.style.display = "none";
                        canvas.focus();
                    }).catch(console.error);
                };
                document.body.appendChild(unityLoader);
            }).catch(console.error);
        });
    </script>

    <!-- Sticky Bottom Center Ad (728x90) with Smooth Slide-Out and Reappearance -->
<style>

</script>

</body>
</html>
